name: Collecte N2YO (KeplerLab)

on:
  schedule:
    # Toutes les 5 minutes (300 s) : 6 satellites * 12/h = 72 req/h (<< 1000 req/h)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22+
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run N2YO collector
        env:
          N2YO_API_KEY: ${{ secrets.N2YO_API_KEY }}
        run: node collector/collect.mjs

      - name: Commit updated archive
        run: |
          git config user.name "kepler-collector-bot"
          git config user.email "actions@github.com"
          git add data/kepler.db || true
          git diff --staged --quiet || (git commit -m "chore: archive N2YO positions [skip ci]" && git push)
